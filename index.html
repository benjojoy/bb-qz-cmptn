<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bible Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manjari:wght@400;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <div class="progress-track">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="header">
    <span id="progressText" style="font-size: 0.9rem; font-weight: 600; color: var(--muted);">Connecting...</span>
    <span id="timerBadge" class="timer-badge hidden">⏳ <span id="timeDisplay">00:00</span></span>
  </div>

  <!-- Screen 1: Registration -->
  <div class="content" id="startScreen">
    <h1 id="quizTitle">Bible Quiz</h1>
    <p class="desc" id="quizDesc">Loading quiz settings and questions from Google Sheets...</p>

    <div class="input-group">
      <label for="nameInput">Full Name / പേര് *</label>
      <input type="text" id="nameInput" placeholder="Enter your full name">
    </div>

    <div class="input-group hidden" id="phoneGroup">
      <label for="phoneInput">Phone Number / ഫോൺ നമ്പർ *</label>
      <input type="text" id="phoneInput" placeholder="Enter your phone number">
    </div>

    <button class="btn" id="startBtn" disabled>Start Quiz</button>
  </div>

  <!-- Screen 2: Question View -->
  <div class="content hidden" id="quizScreen">
    <div class="q-meta" id="qMeta">Question 1</div>
    <div class="question-title" id="qTitle">...</div>
    <div class="options-list" id="optionsContainer"></div>
    <button class="btn" id="nextBtn" disabled>Next Question</button>
  </div>

  <!-- Screen 3: Results & Explanations -->
  <div class="content hidden" id="resultScreen">
    <div class="score-card">
      <h2>Quiz Completed!</h2>
      <div id="participantName"></div>
      <div class="score-number" id="scoreValue">0 / 0</div>
      <p id="scorePercent" style="font-weight: 600;"></p>
    </div>
    <h3 style="margin-bottom: 14px; font-size: 1.1rem;">Review Answers</h3>
    <div id="reviewContainer"></div>
  </div>
</div>

<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
